name: CI

# Hard quality gate. The build must compile and Fallow must find zero dead
# code. This is what stops technical debt from accumulating over time.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.3, pinned to commit SHA
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      # actions/setup-node v6.4.0, pinned to commit SHA
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # BESTPRACTICE_OK pinned v6.4.0 commit SHA
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Offline contract tests
        run: node --test

      - name: Dead code gate (Fallow)
        run: npx -y fallow@2.88.2 dead-code
